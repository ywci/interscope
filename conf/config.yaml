llm:
  provider: "ollama" # openai, anthropic, ollama, deepseek
  model: "qwen3.5:27b" # model name (Ollama tag)
  api_key: "not-needed" # set per provider requirements
  base_url: "http://localhost:11434/v1" # OpenAI‑compatible endpoint
  temperature: 0.2
  max_tokens: 131072
  timeout: 120 # seconds per API call
  retries: 3

provers:
  koika:
    enabled: true
    lemma_mining: true # auto‑generate trivial invariants
    use_mc_lemmas: true # inject model‑checked lemmas
    use_proof_library: false # must be false when PERF is enabled
    prove:
      skill: "rocq-mcp"
      rocq_mcp_path: "rocq-mcp"
      coq_tactic_hints:
      - "induction"
      - "simpl"
      - "auto"
      - "eauto"
      - "rewrite"
      - "inversion"
      - "subst"
      - "destruct"
      - "split"
      - "lia"
      - "nia"
      proof_timeout: 600 # seconds per theorem
      max_consecutive_failures: 10
      max_steps: 80
      pre_simplify: true
      invariant_mining: true
      skeleton_reflection: true
      skeleton_step_tactics: [] # extra tactics for the skeleton proof

  acl2:
    enabled: true
    lemma_mining: true
    mcp_path: "acl2-mcp"
    mcp_timeout: 30
    init_commands: []
    prove:
      skill: "acl2_builtin"
      hint_classes: [ "rewrite", "linear", "induct" ]
      skolem_depth: 2
      defun_sk_enabled: true

verification:
  default_backend: "koika"
  simulation:
    output_dir: "build/sim"
    cycles: 1000
    keep_build: false
    verilator_extra_args: [ "-Wno-fatal", "--assert" ]
  bmc_max_depth: 100
  ic3_max_steps: 1000
  formal_timeout: 300
  split_monolithic_rules: false # set to true to auto‑split on the 'split' attribute
  rule_split_attribute: "split"

proof:
  max_repair_attempts: 5 # used when PERF is disabled

  # PERF: Proof tree Exploration with Reflective Feedback
  perf:
    enabled: true # master switch; false → use linear repair loop

    beam_size: 3 # B – strategies kept per depth
    branches_per_node: 4 # N – variants generated per parent
    depth_limit: 3 # L – maximum refinement iterations

    dimensions:
    - "subgoal_reduction" # Coq subgoals closed relative to parent
    - "trace_alignment" # how well the proof addresses MC trace
    - "syntactic_purity" # favours simpler, less invasive repairs
    primary_dimension: "subgoal_reduction"

    scoring_tournament_size: 2 # pairwise comparisons per node
    generation_temperature: 0.4 # LLM temperature for child generation
    always_verify_children: true # run Coq/MC on every generated child
    max_workers: 4 # parallel evaluation threads
    timeout_per_node: 300 # seconds per node verification
    trace_alignment_weight: 0.6 # weight for trace_alignment dimension

    try_skeleton_first: true # fast skeleton proof before full beam search

    # Temperature scheduling (reduce exploration over depths)
    temperature_decay: 0.0 # factor (0.0 = no decay, 0.9 → reduce to 90% each depth)
    temperature_min: 0.1 # floor for temperature decay

    # Early stopping
    early_stop_patience: 0 # depths with no Pareto improvement before quitting (0 = off)
    early_stop_min_improvement: 0.01 # relative improvement threshold to reset patience

    # Template generator (LLM‑free fallback)
    use_template_generator: false # if True, add template‑based variants

    # Tool health / fast‑failure diagnostics
    max_tool_failures_before_fallback: 3 # consecutive "Unknown error" failures before switching to coqc (0 = never)
    enable_fast_failure_diagnostics: true # run diagnostic pass after depth 2 with no progress
    coqc_timeout: 300 # seconds for coqc fallback verifier

    diversity_strategies:
    - "induction on reachable + auto/lia"
    - "induction on reachable + destruct on step cases"
    - "case analysis on conditions (remember/destruct)"
    - "use available lemmas with rewrite and auto"
    - "apply inversion and substitution, then lia/nia"
    - "use functional induction instead of structural induction"
    - "forward reasoning: assert a helper lemma first"
    unify_repair_and_generation: false # if true, combine repair prompt with variants
    parallel_variant_generation: false # if true, use batch LLM calls for all parents

lifting:
  vcd_parser: "builtin"
  default_mapping_file: "build/rtl/mapping.json"
  llm_lifter_enabled: true
  llm_lifter_confidence_threshold: 0.7

evidence:
  db_path: "build/evidence.db"
  auto_commit: true

logging:
  level: "INFO"
  file: "build/logs/interscope.log"

directories:
  build: "build"
  rtl: "build/rtl"
  traces: "build/traces"
  logs: "build/logs"
  temp: "build/temp"
  verify: "build/verify"
  tools: "tools"
